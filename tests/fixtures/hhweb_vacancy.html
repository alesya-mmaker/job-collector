<html><body><template id="HH-Lux-InitialState">{&quot;vacancyView&quot;: {&quot;vacancyFull&quot;: {&quot;vacancy&quot;: {&quot;vacancyId&quot;: 138710438, &quot;name&quot;: &quot;Инженер технической поддержки (amoCRM, телефония, интеграции)&quot;, &quot;description&quot;: &quot;&lt;p&gt;Цифра Девелопмент — маркетинговое агентство для застройщиков и девелоперов. Мы ведём рекламу и сквозную аналитику и следим за тем, что происходит с лидом после клика: дошёл ли он до CRM, перезвонили ли ему, чем всё закончилось.&lt;/p&gt; &lt;p&gt;Ищем инженера, который будет сопровождать контур продаж наших клиентов-застройщиков: amoCRM, телефонию, мессенджеры, аналитику и сайт. Ваша задача — чтобы каждый лид и звонок попадал в CRM, цифры в отчётах сходились, а сбои закрывались быстро.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Чем предстоит заниматься&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;em&gt;CRM и автоматизация&lt;/em&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Администрировать amoCRM: воронки, статусы, кастомные поля, источники, ответственные, права, дубли, примечания, Digital Pipeline&lt;/li&gt; &lt;li&gt;Собирать автоматизации продаж и маркетинга: сценарии в CRM, вебхуки, no-code-цепочки «лид → CRM → аналитика»&lt;/li&gt; &lt;li&gt;Работать с API: писать запросы, разбирать JSON, отлаживать обмен между системами&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;em&gt;Телефония и интеграции&lt;/em&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Сопровождать IP-телефонию и её связку с CRM: маршруты, номера и добавочные, создание сделок по звонкам&lt;/li&gt; &lt;li&gt;Поддерживать интеграции: Wazzup, Roistat (коллтрекинг и речевая аналитика), сайт на 1С-Битрикс, Profitbase, Яндекс Метрика&lt;/li&gt; &lt;li&gt;Вести Profitbase: шахматки, выгрузки квартир и остатков, связка с сайтом и CRM&lt;/li&gt; &lt;li&gt;Подключать и сопровождать сценарии с нейросетями: ассистенты, автоматизация рутины&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;em&gt;Отчёты и данные&lt;/em&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Вести и дорабатывать дашборд в Яндекс DataLens: править отчёты, сверять метрики, искать причины расхождений&lt;/li&gt; &lt;li&gt;Собирать отчёты и выгрузки по запросу отдела продаж и маркетинга&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;em&gt;Пользователи и сервисы&lt;/em&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Заводить пользователей, выдавать роли и доступы во всех системах, привязывать номера к менеджерам&lt;/li&gt; &lt;li&gt;Следить за оплатой сервисов и выставлением счетов&lt;/li&gt; &lt;li&gt;Разбирать инциденты отдела продаж и маркетинга, писать инструкции, обучать сотрудников&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Что ждём&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Опыт администрирования amoCRM от года&lt;/li&gt; &lt;li&gt;Опыт работы с IP-телефонией и её интеграцией с CRM&lt;/li&gt; &lt;li&gt;Опыт подключения Wazzup или других мессенджеров к CRM&lt;/li&gt; &lt;li&gt;Уверенная работа с API, вебхуками и JSON. Умеете читать логи интеграций и по ним находить, где оборвался обмен&lt;/li&gt; &lt;li&gt;Понимание основ маркетинга: воронка, источники, UTM-метки, чем целевой лид отличается от нецелевого&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Будет плюсом&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Опыт в недвижимости: у застройщика, в агентстве недвижимости или в маркетинге для них&lt;/li&gt; &lt;li&gt;Profitbase: шахматки и выгрузки&lt;/li&gt; &lt;li&gt;Roistat и Яндекс DataLens&lt;/li&gt; &lt;li&gt;Битрикс24 и сайты на 1С-Битрикс&lt;/li&gt; &lt;li&gt;No-code-платформы: MoreKIT, Albato, Make&lt;/li&gt; &lt;li&gt;Автоматизация процессов и работа с нейросетями&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Условия&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Удалённый формат&lt;/li&gt; &lt;li&gt;График 5/2, с 9:00 до 18:00 по Москве&lt;/li&gt; &lt;li&gt;Доход от 80 000 ₽ на руки&lt;/li&gt; &lt;li&gt;Работа напрямую с руководителем ИТ-отдела и собственником, без согласований в несколько уровней&lt;/li&gt; &lt;li&gt;Живые проекты застройщиков: ошибка в интеграции здесь означает потерянные заявки, а хорошая настройка видна в цифрах продаж&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;В отклике напишите пару строк о самой сложной поломке интеграции, которую вы разбирали: что сломалось и как вы нашли причину.&lt;/p&gt;&quot;, &quot;status&quot;: {&quot;archived&quot;: false, &quot;disabled&quot;: false, &quot;hiddenInArchive&quot;: false, &quot;premoderationStatus&quot;: &quot;APPROVED&quot;, &quot;approved&quot;: true, &quot;moderatePriorityScore&quot;: 0}, &quot;company&quot;: {&quot;id&quot;: 12774824, &quot;name&quot;: &quot;Цифра Девелопмент&quot;, &quot;category&quot;: &quot;COMPANY&quot;, &quot;visibleName&quot;: &quot;Цифра Девелопмент&quot;}, &quot;area&quot;: {&quot;id&quot;: 53, &quot;regionId&quot;: 1438, &quot;countryIsoCode&quot;: &quot;RU&quot;, &quot;name&quot;: &quot;Краснодар&quot;, &quot;path&quot;: &quot;.113.224.1438.53.&quot;}, &quot;compensation&quot;: {&quot;from&quot;: 80000, &quot;currencyCode&quot;: &quot;RUR&quot;, &quot;gross&quot;: false, &quot;perModeFrom&quot;: 80000, &quot;mode&quot;: &quot;MONTH&quot;, &quot;frequency&quot;: &quot;MONTHLY&quot;}, &quot;workScheduleByDays&quot;: [&quot;FIVE_ON_TWO_OFF&quot;], &quot;workFormats&quot;: [&quot;REMOTE&quot;], &quot;keySkills&quot;: [&quot;amoCRM&quot;, &quot;Администрирование CRM&quot;, &quot;IP-телефония&quot;, &quot;API&quot;, &quot;JSON&quot;, &quot;Webhooks&quot;, &quot;Интеграция систем&quot;, &quot;Техническая поддержка&quot;, &quot;Wazzup&quot;, &quot;Roistat&quot;, &quot;Яндекс.Метрика&quot;, &quot;Yandex DataLens&quot;, &quot;Битрикс24&quot;, &quot;1С-Битрикс&quot;, &quot;Profitbase&quot;, &quot;Albato&quot;, &quot;Make&quot;, &quot;Автоматизация бизнес-процессов&quot;], &quot;employmentForm&quot;: &quot;FULL&quot;, &quot;workExperience&quot;: &quot;between1And3&quot;, &quot;publicationTimeIso&quot;: &quot;2026-10-21T14:00:21.856+03:00&quot;}}}}</template></body></html>
