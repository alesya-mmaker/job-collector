# Пометки к вакансиям. Ничего не отбрасывают, только подсказывают.
# Ищутся в названии и полном описании (пока описания нет — в сниппете).
# Обычная фраза ищется целым словом без учёта регистра (ё = е).
# Префикс "re:" — регулярное выражение (тоже без учёта регистра).
# source: — пометка считается по данным API, а не по тексту:
#   no_salary        — зарплата не указана
#   private_employer — работодатель частное лицо или самозанятый
#   six_day          — по данным hh график 6/1
# Если у пометки есть и source, и patterns, она ставится по любому из них.

marks:
  - name: нужно читать код
    enabled: true
    patterns:
      - 're:разбира\w*\s+в\s+сгенерированн\w*\s+код\w*'
      - 're:чита\w*\s+(и\s+понимать\s+)?(чуж\w*\s+)?код\w*'
      - 're:ревью\s+код\w*'
      - code review
      - 're:знани\w*\s+(javascript|typescript|python|js|ts)\b[^.\n]{0,60}\bна\s+уровне'

  - name: 6/1
    enabled: true
    source: six_day
    patterns:
      - 're:(?<![\d/])6\s*/\s*1(?![\d/])'
      - 're:шестиднев\w*'

  - name: зп не указана
    enabled: true
    source: no_salary

  - name: работодатель физлицо
    enabled: true
    source: private_employer

  - name: внутренняя автоматизация
    enabled: true
    patterns:
      - 're:внедрени\w*\s+(ии|ai|искусственного\s+интеллекта|нейросет\w*)[^.\n]{0,80}\b(отдел\w*|подразделени\w*)'
      - 're:обучени\w*\s+(наших\s+)?сотрудник\w*'
      - 're:автоматизаци\w*\s+внутренн\w*\s+(бизнес-)?процесс\w*'

  - name: маркетплейсы
    enabled: true
    patterns:
      - wildberries
      - ozon
      - mpstats
      - 1С
      - 1C
      - 're:битрикс\s?24'
      - 're:bitrix\s?24'

  - name: не разработка
    enabled: true
    patterns:
      - 're:верстальщи\w*'
      - 're:в[её]рстк\w*'
      - seo
      - 're:таргетолог\w*'
      - 're:техническ\w*\s+писател\w*'
