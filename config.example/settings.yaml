# Общие параметры сбора. Всё это можно будет править в разделе «Настройки».

hh:
  # Почта для заголовка User-Agent. hh.ru требует настоящий адрес разработчика,
  # без него запросы отклоняются. Заполни перед первым запуском.
  contact_email: ""
  app_name: "JobAutomation/1.0"
  # Откуда брать вакансии hh: web — страницы сайта hh.ru (работает без токена),
  # api — api.hh.ru (сейчас без токена приложения отвечает 403).
  mode: web
  # Пауза между страницами сайта hh, секунды
  web_pause_seconds: 2.0
  # Регионы: 16 — Беларусь, 113 — Россия, 40 — Казахстан
  areas: [16, 113, 40]
  # Сайт hh. На регион не влияет (регион задаёт areas), только на ссылки.
  host: "hh.ru"
  # Пауза между запросами к API, секунды
  pause_seconds: 1.0
  # При первом запуске (или для нового запроса) берём вакансии за столько дней
  initial_lookback_days: 7
  # Запас назад от времени прошлого успешного сбора, минуты.
  # API округляет даты до 5 минут, дубли по id всё равно отсекаются.
  overlap_minutes: 60
  # Как часто перепроверять, не закрыта ли вакансия, дней
  recheck_every_days: 1

telegram:
  pause_seconds: 1.0
  # При первом чтении канала берём посты за столько дней
  initial_lookback_days: 7

boards:
  # Пауза между запросами к Habr Career, Geekjob, getmatch, секунды
  pause_seconds: 1.5
  # При первом запуске берём вакансии за столько дней
  initial_lookback_days: 7

duplicates:
  # Насколько похожими должны быть названия у одной компании,
  # чтобы считать вакансию возможным повтором (0..1)
  title_similarity: 0.85
