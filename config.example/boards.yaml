# Русскоязычные IT-площадки (кроме hh). Только удалённые вакансии.
# Habr Career ищет по словам сам; Geekjob и getmatch отдают всю ленту.
# В любом случае каждое слово проверяется у нас: в названии, навыках и
# полном описании. Правила слов те же, что в marks.yaml: обычная фраза
# ищется целым словом, пробел и дефис взаимозаменяемы («AI-инженер» =
# «AI инженер»). Язык запросов hh (OR, кавычки) здесь не работает.

boards:
  habr:
    enabled: true
  geekjob:
    enabled: true
  getmatch:
    enabled: true

